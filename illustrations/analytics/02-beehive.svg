.drift{animation:drift 48s ease-in-out infinite alternate}@keyframes drift{from{translate:-40px 0}to{translate:50px 0}}
.sway{transform-origin:800px 900px;animation:sway 7s ease-in-out infinite alternate}@keyframes sway{from{transform:skewX(-.5deg)}to{transform:skewX(.5deg)}}
