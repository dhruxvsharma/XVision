.beat{transform-box:fill-box;transform-origin:center;animation:beat 3s ease-in-out infinite}@keyframes beat{0%,100%{scale:1}50%{scale:1.16}}
.march{animation:march 1.8s linear infinite}@keyframes march{to{stroke-dashoffset:-13}}
.rb{opacity:0;offset-rotate:0deg;animation:rfly 4s infinite}@keyframes rfly{0%{offset-distance:0%;opacity:0}6%{offset-distance:0%;opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}66%{offset-distance:100%;opacity:1}74%,100%{offset-distance:100%;opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 4s ease-out infinite}@keyframes ping{0%,64%{opacity:0;scale:1}66%{opacity:.9;scale:1}90%,100%{opacity:0;scale:2}}
.gfill{stroke-dasharray:1 2;animation:gfill 5s infinite}@keyframes gfill{0%,6%{stroke-dashoffset:1;opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}62%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.gdot{opacity:0;offset-rotate:0deg;animation:gdot 5s infinite}@keyframes gdot{0%{offset-distance:0%;opacity:0}6%{offset-distance:0%;opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}62%,90%{offset-distance:100%;opacity:1}100%{offset-distance:100%;opacity:0}}
.spoke{stroke-dasharray:1 2;animation:spoke 7s linear infinite}@keyframes spoke{0%{stroke-dashoffset:1;opacity:1;animation-timing-function:cubic-bezier(.3,0,.2,1)}12%,84%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
.sdot{transform-box:fill-box;transform-origin:center;animation:sdot 7s ease-out infinite}@keyframes sdot{0%,9%{opacity:0;scale:.3}15%,84%{opacity:1;scale:1}96%,100%{opacity:0;scale:.3}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow linear both;}@keyframes grow{from{scale:1 .04}to{scale:1 1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
