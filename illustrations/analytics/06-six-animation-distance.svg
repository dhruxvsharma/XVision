<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg" width="720" height="450"><style>.hud{animation:hud 8s linear infinite}@keyframes hud{0%{opacity:0}3%,90%{opacity:1}98%,100%{opacity:0}}
.tm{stroke-dasharray:1 2;animation:td 8s infinite}@keyframes td{0%,5%{stroke-dashoffset:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}36%,100%{stroke-dashoffset:0}}
.tm2{stroke-dasharray:1 2;animation:td2 8s ease-out infinite}@keyframes td2{0%,36%{stroke-dashoffset:1}46%,100%{stroke-dashoffset:0}}
.ball{opacity:0;offset-rotate:0deg;animation:fly 8s infinite}@keyframes fly{0%{offset-distance:0%;opacity:0}5%{offset-distance:0%;opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}36%{offset-distance:100%;opacity:1}38%,100%{offset-distance:100%;opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 8s ease-out infinite}@keyframes pulse{0%,35%{opacity:0;scale:1}36%{opacity:.9}52%,100%{opacity:0;scale:3}}
.a14{animation:a14 8s cubic-bezier(.2,.8,.2,1) infinite}@keyframes a14{0%,14%{opacity:0;translate:0 6px}17%,100%{opacity:1;translate:0 0}}
.a28{animation:a28 8s cubic-bezier(.2,.8,.2,1) infinite}@keyframes a28{0%,28%{opacity:0;translate:0 6px}31%,100%{opacity:1;translate:0 0}}
.a35{animation:a35 8s cubic-bezier(.2,.8,.2,1) infinite}@keyframes a35{0%,35%{opacity:0;translate:0 6px}38%,100%{opacity:1;translate:0 0}}
.a41{animation:a41 8s cubic-bezier(.2,.8,.2,1) infinite}@keyframes a41{0%,41%{opacity:0;translate:0 6px}44%,100%{opacity:1;translate:0 0}}
.a47{animation:a47 8s cubic-bezier(.2,.8,.2,1) infinite}@keyframes a47{0%,47%{opacity:0;translate:0 6px}50%,100%{opacity:1;translate:0 0}}
.drift{animation:drift 48s ease-in-out infinite alternate}@keyframes drift{from{translate:-40px 0}to{translate:50px 0}}
.sway{transform-origin:800px 900px;animation:sway 7s ease-in-out infinite alternate}@keyframes sway{from{transform:skewX(-.5deg)}to{transform:skewX(.5deg)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 6s ease-in-out infinite}@keyframes pop{0%,2%{opacity:0;scale:.3}8%,82%{opacity:1;scale:1}94%,100%{opacity:0;scale:.3}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 3s ease-in-out infinite}@keyframes beat{0%,100%{scale:1}50%{scale:1.16}}
.march{animation:march 1.8s linear infinite}@keyframes march{to{stroke-dashoffset:-13}}
.rb{opacity:0;offset-rotate:0deg;animation:rfly 4s infinite}@keyframes rfly{0%{offset-distance:0%;opacity:0}6%{offset-distance:0%;opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}66%{offset-distance:100%;opacity:1}74%,100%{offset-distance:100%;opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 4s ease-out infinite}@keyframes ping{0%,64%{opacity:0;scale:1}66%{opacity:.9;scale:1}90%,100%{opacity:0;scale:2}}
.gfill{stroke-dasharray:1 2;animation:gfill 5s infinite}@keyframes gfill{0%,6%{stroke-dashoffset:1;opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}62%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.gdot{opacity:0;offset-rotate:0deg;animation:gdot 5s infinite}@keyframes gdot{0%{offset-distance:0%;opacity:0}6%{offset-distance:0%;opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}62%,90%{offset-distance:100%;opacity:1}100%{offset-distance:100%;opacity:0}}
.spoke{stroke-dasharray:1 2;animation:spoke 7s linear infinite}@keyframes spoke{0%{stroke-dashoffset:1;opacity:1;animation-timing-function:cubic-bezier(.3,0,.2,1)}12%,84%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
.sdot{transform-box:fill-box;transform-origin:center;animation:sdot 7s ease-out infinite}@keyframes sdot{0%,9%{opacity:0;scale:.3}15%,84%{opacity:1;scale:1}96%,100%{opacity:0;scale:.3}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow linear both;}@keyframes grow{from{scale:1 .04}to{scale:1 1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
