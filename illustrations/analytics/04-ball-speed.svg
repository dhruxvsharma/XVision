<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg" width="720" height="450"><style>.hud{animation:hud 8s linear infinite}@keyframes hud{0%{opacity:0}3%,90%{opacity:1}98%,100%{opacity:0}}
.tm{stroke-dasharray:1 2;animation:td 8s infinite}@keyframes td{0%,5%{stroke-dashoffset:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}36%,100%{stroke-dashoffset:0}}
.tm2{stroke-dasharray:1 2;animation:td2 8s ease-out infinite}@keyframes td2{0%,36%{stroke-dashoffset:1}46%,100%{stroke-dashoffset:0}}
.ball{opacity:0;offset-rotate:0deg;animation:fly 8s infinite}@keyframes fly{0%{offset-distance:0%;opacity:0}5%{offset-distance:0%;opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)}36%{offset-distance:100%;opacity:1}38%,100%{offset-distance:100%;opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 8s ease-out infinite}@keyframes pulse{0%,35%{opacity:0;scale:1}36%{opacity:.9}52%,100%{opacity:0;scale:3}}
.a14{animation:a14 8s cubic-bezier(.2,.8,.2,1) infinite}@keyframes a14{0%,14%{opacity:0;translate:0 6px}17%,100%{opacity:1;translate:0 0}}
